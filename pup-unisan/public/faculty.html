<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Faculty Dashboard – PUP-Unisan</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script></head><body>
<main class="s"><div class="wrap"><h1 id="w">Faculty Dashboard</h1><div id="pf"></div>
<h2>Announcements</h2><div id="an"></div><button class="btn ghost" id="lo">Log out</button></div></main>
<script type="module">
import {sb,layout,esc,annItem,requireRole,logout} from './js/app.js';layout('faculty.html');
const u=await requireRole('faculty');if(u){
document.getElementById('lo').onclick=logout;document.getElementById('w').textContent='Welcome, '+u.name;
const {data:f}=await sb.from('faculty').select('*').eq('user_id',u.user.id).maybeSingle();
document.getElementById('pf').innerHTML=f?`<div class="card"><div class="b"><h3>${esc(f.full_name)}</h3><p>ID: ${esc(f.faculty_id)}<br>Email: ${esc(f.email)}<br>Department: ${esc(f.department)}<br>Position: ${esc(f.position)}</p></div></div>`:'<p class="empty">No faculty profile found. Contact an administrator.</p>';
const {data:a}=await sb.from('announcements').select('*').eq('published',true).order('published_at',{ascending:false});
document.getElementById('an').innerHTML=(a||[]).map(x=>annItem(x,true)).join('')||'<p class="empty">No announcements available at the moment.</p>';}
</script></body></html>
